name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyYAML>=6.0 flake8 black
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Check code formatting with black
      run: |
        black --check --diff src/
    
    - name: Validate YAML files
      run: |
        python -c "import yaml; yaml.safe_load(open('etc/pypolicyd/main.yml'))"
        python -c "import yaml; yaml.safe_load(open('etc/pypolicyd/policy-rules.yml'))"
        
        # Check policy-rules.d directory
        for file in etc/pypolicyd/policy-rules.d/*.yml; do
          echo "Validating $file"
          python -c "import yaml; yaml.safe_load(open('$file'))"
        done
    
    - name: Test Python modules compilation
      run: |
        python -m py_compile src/pypolicyd/smtp_policy_daemon.py
        python -m py_compile src/pypolicyd/policy_rules.py
        python -m py_compile src/pypolicyd/smtp-policy-ctl.py
    
    - name: Run configuration tests
      run: |
        python test_new_config.py
    
    - name: Test CLI tools
      run: |
        python src/pypolicyd/smtp_policy_daemon.py --help
        python src/pypolicyd/smtp-policy-ctl.py --help
    
    - name: Test policy configuration loading
      run: |
        python src/pypolicyd/smtp-policy-ctl.py --config etc/pypolicyd/main.yml test-config
        python src/pypolicyd/smtp-policy-ctl.py --config etc/pypolicyd/main.yml show-policy admin@example.com
        python src/pypolicyd/smtp-policy-ctl.py --config etc/pypolicyd/main.yml show-policy user@example.com
        python src/pypolicyd/smtp-policy-ctl.py --config etc/pypolicyd/main.yml show-policy test@unknown.com
