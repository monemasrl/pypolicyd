# Configurazione principale PyPolicyd (Python SMTP Policy Daemon)
# File di configurazione unificato per il demone

# Configurazione del daemon
daemon:
  name: "pypolicyd"
  pid_file: "/var/run/pypolicyd/pypolicyd.pid"
  log_file: "/var/log/pypolicyd/pypolicyd.log"
  log_level: "INFO"

# Configurazione SMTP Policy
smtp_policy:
  config_file: "/etc/pypolicyd/main.yml"
  database: "/var/lib/pypolicyd/policy.db"
  host: "127.0.0.1"
  port: 10040
  
  # Configurazione logging SMTP
  log_level: "INFO"
  log_file: "/var/log/pypolicyd/smtp-policy.log"
  log_to_syslog: false
  syslog_facility: "mail"
  log_request: "rejected"  # all, rejected, none
  
  # Configurazione avanzata
  enable_advanced_rates: true
  cleanup_interval: 300
  
  # File o directory delle regole policy
  # Usa directory modulare per organizzare le regole per dominio
  policy_rules_file: "/etc/pypolicyd/policy-rules.d"
  # Oppure usa file singolo per retrocompatibilità:
  # policy_rules_file: "/etc/pypolicyd/policy-rules.yml"

# Policy di default per tutti gli utenti (quando non specificato altrove)
default_policy:
  max_recipients: 50     # Max destinatari per email
  max_size: "25M"        # Dimensione massima email
  rate_limits:           # Rate limits di default
    - "10/1m"           # 10 email al minuto
    - "100/1h"          # 100 email all'ora
    - "1000/1d"         # 1000 email al giorno

# Configurazione database
database:
  type: "sqlite"
  path: "/var/lib/pypolicyd/policy.db"
  
# Configurazione monitoring
monitoring:
  enabled: true
  interval: 60
  metrics_file: "/var/log/pypolicyd/metrics.log"
