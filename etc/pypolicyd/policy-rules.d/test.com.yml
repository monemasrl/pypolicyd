# Policy Rules per test.com con formato gerarchico
# File: policy-rules.d/test.com.yml

domains:
  - name: "test.com"
    # Domain-wide limits for test domain (more restrictive)
    domain_limits:
      rate_limits: ["500/1h", "5000/1d"]
      max_recipients: 50
      max_size: "20M"
    
    # Test domain users
    users:
      "admin@test.com":
        rate_limits: ["80/1h", "800/1d"]
        max_recipients: 25
        max_size: "15M"
      
      "support@test.com":
        rate_limits: ["100/1h", "1000/1d"]
        max_recipients: 50
        max_size: "20M"
      
      # Default for all test users (restrictive)
      "*@test.com":
        rate_limits: ["50/1h", "500/1d"]
        max_recipients: 10
        max_size: "5M"