# Policy Rules per example.com
# File: policy-rules.d/example.com.yml

# Regola generale per il dominio
"*@example.com":
  max_recipients: 100
  max_size: "50M"
  rate_limits:
    - "50/1m"        # Max 50 email al minuto
    - "500/1h"       # Max 500 email all'ora
    - "5000/1d"      # Max 5000 email al giorno
    - "100000/1M"    # Max 100000 email al mese

# Utenti specifici del dominio
"admin@example.com":
  max_recipients: 200
  max_size: "100M"
  rate_limits:
    - "20/1m"        # Max 20 email al minuto
    - "200/1h"       # Max 200 email all'ora
    - "2000/1d"      # Max 2000 email al giorno
    - "50000/1M"     # Max 50000 email al mese

"user@example.com":
  max_recipients: 25
  max_size: "10M"
  rate_limits:
    - "5/1m"         # Max 5 email al minuto
    - "50/1h"        # Max 50 email all'ora
    - "500/1d"       # Max 500 email al giorno
    - "10000/1M"     # Max 10000 email al mese

"marketing@example.com":
  max_recipients: 1000
  max_size: "25M"
  rate_limits:
    - "1/1s"         # Max 1 email per secondo
    - "100/5m"       # Max 100 email per 5 minuti
    - "200/1h"       # Max 200 email per ora
    - "1000/1d"      # Max 1000 email per giorno
    - "50000/1M"     # Max 50000 email per mese

"support@example.com":
  max_recipients: 100
  max_size: "20M"
  rate_limits:
    - "10/1m"        # Max 10 email al minuto
    - "100/1h"       # Max 100 email all'ora
    - "1000/1d"      # Max 1000 email al giorno
    - "20000/1M"     # Max 20000 email al mese
