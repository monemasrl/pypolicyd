# Policy Rules per example.com con formato gerarchico
# File: policy-rules.d/example.com.yml

domains:
  - name: "example.com"
    # Domain-wide limits (affect all users in domain)
    domain_limits:
      rate_limits: ["1000/1h", "10000/1d"]
      max_recipients: 100
      max_size: "50M"
    
    # Individual user policies
    users:
      "admin@example.com":
        rate_limits: ["100/1h", "1000/1d"]
        max_recipients: 100
        max_size: "50M"
      
      "user@example.com":
        rate_limits: ["50/1h", "500/1d"]
        max_recipients: 50
        max_size: "25M"
      
      "marketing@example.com":
        rate_limits: ["100/5m", "200/1h", "1000/1d"]
        max_recipients: 1000
        max_size: "25M"
      
      "support@example.com":
        rate_limits: ["10/1m", "100/1h", "1000/1d"]
        max_recipients: 100
        max_size: "20M"
      
      # Wildcard for all users in domain
      "*@example.com":
        rate_limits: ["20/1h", "200/1d"]
        max_recipients: 25
        max_size: "10M"
