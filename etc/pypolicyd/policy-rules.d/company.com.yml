# Policy Rules per company.com con formato gerarchico
# File: policy-rules.d/company.com.yml

domains:
  - name: "company.com"
    # Domain-wide limits for corporate domain
    domain_limits:
      rate_limits: ["2000/1h", "20000/1d"]
      max_recipients: 500
      max_size: "100M"
    
    # Corporate user policies
    users:
      "ceo@company.com":
        rate_limits: ["500/1h", "5000/1d"]
        max_recipients: 500
        max_size: "100M"
      
      "manager@company.com":
        rate_limits: ["300/1h", "3000/1d"]
        max_recipients: 300
        max_size: "75M"
      
      "sales@company.com":
        rate_limits: ["100/1h", "1000/1d"]
        max_recipients: 200
        max_size: "50M"
      
      "hr@company.com":
        rate_limits: ["50/1h", "500/1d"]
        max_recipients: 100
        max_size: "25M"
      
      "it@company.com":
        rate_limits: ["200/1h", "2000/1d"]
        max_recipients: 50
        max_size: "100M"
      
      # Default for all company users
      "*@company.com":
        rate_limits: ["20/1h", "200/1d"]
        max_recipients: 50
        max_size: "25M"
