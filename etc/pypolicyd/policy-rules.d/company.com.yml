# Policy Rules per company.com
# File: policy-rules.d/company.com.yml

# Regola generale per il dominio aziendale
"*@company.com":
  max_recipients: 100
  max_size: "50M"
  rate_limits:
    - "20/1m"        # Max 20 email al minuto
    - "200/1h"       # Max 200 email all'ora  
    - "2000/1d"      # Max 2000 email al giorno
    - "50000/1M"     # Max 50000 email al mese

# Dirigenti e manager (limiti più alti)
"ceo@company.com":
  max_recipients: 500
  max_size: "100M"
  rate_limits:
    - "50/1m"
    - "500/1h"
    - "5000/1d"
    - "100000/1M"

"manager@company.com":
  max_recipients: 300
  max_size: "75M"
  rate_limits:
    - "30/1m"
    - "300/1h"
    - "3000/1d"
    - "75000/1M"

# Marketing e comunicazione
"marketing@company.com":
  max_recipients: 1000
  max_size: "25M"
  rate_limits:
    - "100/1m"
    - "1000/1h"
    - "10000/1d"
    - "200000/1M"

"newsletter@company.com":
  max_recipients: 5000
  max_size: "10M"
  rate_limits:
    - "200/1m"
    - "2000/1h"
    - "20000/1d"
    - "500000/1M"
